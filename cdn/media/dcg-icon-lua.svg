<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 936 936">
<!-- The Lua mark, in one colour, for use as an icon.

     Monochrome by construction rather than by recolouring: the original is navy on white, and
     its white parts - the notch out of the body, and the "Lua" itself - are holes rather than
     paint. Filled in one colour they would disappear, so they are cut out of the body with a
     mask and everything that is left is `currentColor`. Used as a CSS mask-image, where only
     the alpha matters, that reads the same way.

     Derived from ./lua.svg; the geometry is that file's, untouched. The viewBox is not: the
     original carries about 230 units of padding, most of it on two sides, which in a square
     icon box would have drawn the mark small and off-centre. This one is the drawing's own
     bounds - a 924x925 square - squared off and given a 6-unit margin. -->
<mask id="cut" maskUnits="userSpaceOnUse" x="-6" y="-6" width="936" height="936">
<circle r="353.21" cx="461.559" cy="461.697" fill="#fff"/>
<circle r="103.45" cx="607.869" cy="315.397" fill="#000"/>
